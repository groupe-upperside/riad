name: CI

on:
    pull_request:
    workflow_call:
        inputs:
            publish-image:
                type: boolean
                default: false
        outputs:
            image-tag:
                value: ${{ jobs.docker.outputs.image-tag }}

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    validate:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
            - name: Define environment
              uses: ./.github/actions/define_env
              with:
                  NEXT_PUBLIC_CDN_URL: ${{ vars.NEXT_PUBLIC_CDN_URL }}
                  POEDITOR_URL: ${{ vars.POEDITOR_URL }}
                  POEDITOR_APP_ID: ${{ vars.POEDITOR_APP_ID }}
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version: 1.3.14
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Validate
              run: bun run validate
            - name: Check formatting
              run: bun run prettier:check
            - name: Check deployment scripts
              run: |
                  bash -n .github/actions/deployment/release.sh .github/actions/deployment/upload-release.sh
                  bun run test:deploy
            - name: Install Chromium
              run: bunx playwright install --with-deps chromium
            - name: Build and check public pages
              run: bun run test:e2e
            - name: Check visual regressions
              run: bun run test:e2e:visual
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7

    docker:
        needs: validate
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        outputs:
            image-tag: ${{ steps.package.outputs.image-tag }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
            - name: Define environment
              uses: ./.github/actions/define_env
              with:
                  NEXT_PUBLIC_CDN_URL: ${{ vars.NEXT_PUBLIC_CDN_URL }}
                  POEDITOR_URL: ${{ vars.POEDITOR_URL }}
                  POEDITOR_APP_ID: ${{ vars.POEDITOR_APP_ID }}
            - name: Build production image
              run: docker build --target production --build-arg NEXT_PUBLIC_CDN_URL="$NEXT_PUBLIC_CDN_URL" -t riad-front:ci .
            - name: Check container health
              run: |
                  docker run -d --name riad-front-ci -p 127.0.0.1:3102:3000 \
                    -e APP_MAILJET_KEY=test -e APP_MAILJET_SECRET=test \
                    -e STAFF_BASE_URL=https://www.riadnashira.com \
                    -e STAFF_AUTH_SECRET="$(openssl rand -hex 32)" \
                    -e STAFF_BOOTSTRAP_PASSWORD="$(openssl rand -hex 24)" riad-front:ci
                  curl --fail --retry 20 --retry-connrefused --retry-delay 1 --max-time 5 http://127.0.0.1:3102/api/health
                  curl --fail --max-time 15 --output /dev/null http://127.0.0.1:3102/fr
                  curl --fail --max-time 15 --output /dev/null --header "Host: www.riadnashira.com" --header "X-Forwarded-Host: www.riadnashira.com" --header "X-Forwarded-Proto: https" http://127.0.0.1:3102/fr/hebergements/confort
            - name: Check staff accounts and persisted history
              run: node tests/docker/staff-smoke.cjs riad-front:ci
            - name: Package tested release image
              id: package
              if: inputs.publish-image
              run: |
                  tag="release-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                  mkdir -p release/deployment
                  docker tag riad-front:ci "riad-front:$tag"
                  docker image inspect --format '{{.Id}}' "riad-front:$tag" > release/image-id
                  printf '%s\n' "$tag" > release/image-tag
                  printf '%s\n' "$NEXT_PUBLIC_CDN_URL" > release/cdn-url
                  docker save "riad-front:$tag" | gzip > release/image.tar.gz
                  cp docker-compose.production.yml release/
                  cp .github/actions/deployment/release.sh .github/actions/deployment/backup-staff-db.cjs release/deployment/
                  (cd release && sha256sum image.tar.gz image-id image-tag cdn-url docker-compose.production.yml deployment/* > SHA256SUMS)
                  echo "image-tag=$tag" >> "$GITHUB_OUTPUT"
            - uses: actions/upload-artifact@v7
              if: inputs.publish-image
              with:
                  name: production-image
                  path: release/
                  retention-days: 1
            - name: Container logs
              if: failure()
              run: docker logs riad-front-ci
            - name: Clean up
              if: always()
              run: docker rm -f riad-front-ci || true
